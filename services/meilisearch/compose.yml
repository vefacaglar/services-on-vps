name: meilisearch

services:
  meilisearch:
    # v1.56.2; the digest pins the multi-arch image index.
    image: getmeili/meilisearch:v1.56.2@sha256:9600db22be3fcbf3d506176d3a73dd70a65c5719d9aa1d2837355b75afb8f4fb
    restart: unless-stopped
    # MEILI_MASTER_KEY only; written 0600 by the deploy, never in Git.
    env_file:
      - path: ./meilisearch.env
        format: raw
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      MEILI_DB_PATH: /meili_data/data.ms
      MEILI_DUMP_DIR: /meili_data/dumps
      MEILI_SNAPSHOT_DIR: /meili_data/snapshots
      # Meilisearch sizes indexing from host RAM, not the cgroup limit; keep
      # this well below mem_limit so bulk imports stay inside the container.
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-512Mb}
      MEILI_MAX_INDEXING_THREADS: ${MEILI_MAX_INDEXING_THREADS:-2}
    ports:
      # Admin access over an SSH tunnel only; apps use the proxy network.
      - "127.0.0.1:${MEILI_HTTP_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data
    networks:
      default:
      proxy:
        aliases: [meilisearch]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, "3", "http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    mem_limit: ${MEILI_MEMORY_LIMIT:-1g}
    cpus: ${MEILI_CPU_LIMIT:-1.0}
    # Not read_only: indexing writes temporary files outside the data volume.
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  meili-data:

networks:
  proxy:
    external: true
    name: ${LOGS_PROXY_NETWORK:-databases_default}
