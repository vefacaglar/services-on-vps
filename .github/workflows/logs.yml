name: Services CI and deploy
# Verifies and deploys every service under services/ (logs, Meilisearch, Woodpecker CI).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: logs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/logs/client/package-lock.json
      - name: Verify and build React client
        working-directory: services/logs/client
        run: |
          npm ci --no-fund --no-audit
          npm test
          npm run build
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/logs/console/go.mod
          cache-dependency-path: services/logs/console/go.sum
      - name: Verify log console and session authentication
        working-directory: services/logs/console
        env:
          POSTGRES_INTEGRATION: skip
        run: go test -race ./...
      - name: Verify the PostgreSQL inspector and write mode against PostgreSQL 17
        # Starts a throwaway postgres:17 container, creates the documented
        # roles, checks that the read editor refuses writes and that write
        # mode previews, commits and edits rows only as confirmed.
        working-directory: services/logs/console
        env:
          POSTGRES_INTEGRATION: '1'
        run: go test -race -run 'TestPostgres(Write)?Integration' -v ./...
      - name: Check deployment scripts
        run: |
          sh -n scripts/start.sh services/*/scripts/*.sh
          bash -n scripts/ssh-deploy.sh scripts/activate.sh
          shellcheck scripts/*.sh services/*/scripts/*.sh
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify real Docker log ingestion
        run: ./scripts/start.sh
      - name: Verify browser authentication and read-only routes
        env:
          RUN_BROWSER_TEST: '1'
        run: python3 -m unittest discover -s tests -p 'test_browser.py' -v
      - name: Verify Meilisearch with an ephemeral key
        env:
          LOGS_PROXY_NETWORK: meilisearch-ci
        run: |
          docker network create meilisearch-ci
          (umask 077; printf 'MEILI_MASTER_KEY=%s\n' "$(openssl rand -hex 32)" > services/meilisearch/meilisearch.env)
          ./services/meilisearch/scripts/start.sh
          # A second run with unchanged config must not restart the container.
          started=$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose -f services/meilisearch/compose.yml ps -q meilisearch)")
          ./services/meilisearch/scripts/start.sh
          test "$started" = "$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose -f services/meilisearch/compose.yml ps -q meilisearch)")"
      - name: Verify Woodpecker CI with ephemeral secrets
        env:
          LOGS_PROXY_NETWORK: woodpecker-ci
          WOODPECKER_GITHUB_CLIENT: ci-placeholder-client
          WOODPECKER_GITHUB_SECRET: ci-placeholder-secret-0000
          WOODPECKER_ADMIN: ci-placeholder
        run: |
          docker network create woodpecker-ci
          # Same files the deploy writes; the OAuth app is a placeholder, so
          # this checks start-up, agent registration and that the API is closed.
          WOODPECKER_AGENT_SECRET=$(openssl rand -hex 32) python3 scripts/prepare-woodpecker.py services/woodpecker
          ./services/woodpecker/scripts/start.sh
          # A second run with unchanged config must not restart a running build agent.
          started=$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose -f services/woodpecker/compose.yml ps -q agent)")
          ./services/woodpecker/scripts/start.sh
          test "$started" = "$(docker inspect -f '{{.State.StartedAt}}' "$(docker compose -f services/woodpecker/compose.yml ps -q agent)")"
      - name: Show service diagnostics
        if: failure()
        run: |
          docker compose -f services/logs/compose.yml logs --tail=60
          docker compose -f services/meilisearch/compose.yml logs --tail=60 || true
          LOGS_PROXY_NETWORK=woodpecker-ci docker compose -f services/woodpecker/compose.yml logs --tail=60 || true
      - name: Clean up test services
        if: always()
        env:
          LOGS_PROXY_NETWORK: meilisearch-ci
        run: |
          docker compose -f services/logs/compose.yml down --volumes --remove-orphans
          if [ -f services/meilisearch/meilisearch.env ]; then
            docker compose -f services/meilisearch/compose.yml down --volumes --remove-orphans
          fi
          docker network rm meilisearch-ci || true
          if [ -f services/woodpecker/server.env ]; then
            LOGS_PROXY_NETWORK=woodpecker-ci docker compose -f services/woodpecker/compose.yml down --volumes --remove-orphans
          fi
          docker network rm woodpecker-ci || true

  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.LOGS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: logs-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Upload verified configuration and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_DEPLOY_DIR: ${{ vars.VPS_DEPLOY_DIR || '/opt/logs-on-vps' }}
          DEPLOY_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          LOGS_UI_USERNAME: ${{ secrets.LOGS_UI_USERNAME }}
          LOGS_UI_PASSWORD: ${{ secrets.LOGS_UI_PASSWORD }}
          LOGS_UI_TOTP_SECRET: ${{ secrets.LOGS_UI_TOTP_SECRET }}
          MEILI_MASTER_KEY: ${{ secrets.MEILI_MASTER_KEY }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_READONLY_URL: ${{ secrets.POSTGRES_READONLY_URL }}
          POSTGRES_WRITE_ENABLED: ${{ vars.POSTGRES_WRITE_ENABLED }}
          WOODPECKER_GITHUB_CLIENT: ${{ secrets.WOODPECKER_GITHUB_CLIENT }}
          WOODPECKER_GITHUB_SECRET: ${{ secrets.WOODPECKER_GITHUB_SECRET }}
          WOODPECKER_AGENT_SECRET: ${{ secrets.WOODPECKER_AGENT_SECRET }}
          WOODPECKER_API_TOKEN: ${{ secrets.WOODPECKER_API_TOKEN }}
          WOODPECKER_ADMIN: ${{ vars.WOODPECKER_ADMIN }}
          WOODPECKER_DOMAIN: ${{ vars.WOODPECKER_DOMAIN }}
          LOGS_PROXY_NETWORK: ${{ vars.LOGS_PROXY_NETWORK }}
          LOGS_CADDY_CONTAINER: ${{ vars.LOGS_CADDY_CONTAINER }}
          LOGS_CADDY_CONFIG_PATH: ${{ vars.LOGS_CADDY_CONFIG_PATH }}
        run: bash scripts/ssh-deploy.sh
